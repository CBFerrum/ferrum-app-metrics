package: metrics
version: 0.1.0
label: Metrics
description: "Metrics and datasets defined once on Studio, certified by a steward, kept under change control with their lineage, read with each person's own rights, loaded into a warehouse, and a glossary"
depends: [core]

modules:
  - name: metrics
    label: Metrics
    icon: layout-dashboard
    order: 62
    items: [Metric, Dataset, BusinessTerm, MetricSnapshot, MetricSubscription, ExternalSource]

roles:
  - name: Metric Author
    description: Defines metrics, datasets and glossary terms; what they define is certified by someone else.
    permissions:
      - {entity: Metric, read: true, write: true, create: true}
      - {entity: Dataset, read: true, write: true, create: true}
      - {entity: BusinessTerm, read: true, write: true, create: true}
      - {entity: MetricSnapshot, read: true, if_owner: true}
      - {entity: MetricSubscription, read: true, write: true, create: true, delete: true, if_owner: true}
      - {entity: ExternalSource, read: true}
  - name: Data Steward
    description: Certifies and deprecates metrics and datasets, and keeps the glossary.
    permissions:
      - {entity: Metric, read: true, write: true}
      - {entity: Dataset, read: true, write: true}
      - {entity: BusinessTerm, read: true, write: true, create: true}
      - {entity: MetricSnapshot, read: true, export: true, if_owner: true}
      - {entity: ExternalSource, read: true, write: true, create: true, delete: true}
      - {entity: MetricSubscription, read: true, write: true, create: true, delete: true, if_owner: true}
  - name: Metric Reader
    description: Reads certified metrics and datasets, with their own rights to the records they count, and loads them into a warehouse.
    permissions:
      - {entity: Metric, read: true, where: {status: Certified}}
      - {entity: Dataset, read: true, where: {status: Certified}}
      - {entity: BusinessTerm, read: true}
      - {entity: MetricSnapshot, read: true, if_owner: true}
      - {entity: MetricSubscription, read: true, write: true, create: true, delete: true, if_owner: true}

# A kept value was read with its reader's rights, so it is theirs to see: no role reads another's,
# however much it may do with the metrics themselves.
#
# Personal-data requests reach the people Metrics names by address: who owns, certifies and reads a
# metric, who keeps a term, and who follows one. Erasure takes the address off; the records stay.
personal_data:
  - {entity: Metric, match: owner, erase: [owner]}
  - {entity: Metric, match: certified_by, erase: [certified_by]}
  - {entity: Dataset, match: owner, erase: [owner]}
  - {entity: Dataset, match: certified_by, erase: [certified_by]}
  - {entity: BusinessTerm, match: owner, erase: [owner]}
  - {entity: MetricSnapshot, match: read_by, erase: [read_by]}
  - {entity: MetricSubscription, match: subscriber, erase: [subscriber]}
