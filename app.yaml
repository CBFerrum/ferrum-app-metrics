id: metrics
name: Metrics
version: 0.3.2
publisher: cbferrum
summary: "Metrics and datasets defined once on Studio, certified by a steward, kept under change control with their lineage, read with each person's own rights, loaded into a warehouse, and a glossary"
description: README.md
categories: [analytics]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-metrics
support: https://github.com/CBFerrum/ferrum-app-metrics/issues
runtime: native
platform: ">=0.3.2, <0.4"
packages: [metrics]
uninstall: ask
# Its own interface at /kpis/ (the core keeps /metrics): the certified metrics with their values for the viewer.
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: metrics
      route: kpis
      title: Metrics
      description: Certified metrics and the glossary
      icon: layout-dashboard
      color: "#0f766e"
      roles: [Metric Author, Data Steward, Metric Reader]
  shell.open:
    - {id: metrics, package: metrics, path: "kpis/e/{entity}/{id}", list: "kpis/e/{entity}"}
  shell.create:
    - {id: metric, label: Metric, path: kpis/e/Metric/new, entity: Metric}
    - {id: follow, label: Followed Metric, path: kpis/e/MetricSubscription/new, entity: MetricSubscription}
  # The kind of notification Metrics sends ({app}.{id}, as src/delivery.rs sends it); each person
  # chooses how it reaches them.
  shell.notification:
    - {id: digest, label: Metrics you follow, default: [inapp]}
